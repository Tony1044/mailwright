[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
mailcraft-graph = { path = "crates/graph" }
mailcraft-store = { path = "crates/store" }
mailcraft-sync = { path = "crates/sync" }
mailcraft-html = { path = "crates/html" }
mailcraft-ui = { path = "crates/ui" }
mockgraph = { path = "tools/mockgraph" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
url = "2.5"
ureq = { version = "3.1", default-features = false, features = ["rustls", "gzip", "platform-verifier", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17"
open = "5"
dirs = "6"
mime_guess = "2"
keyring = { version = "3.6", features = ["windows-native", "async-secret-service", "async-io", "crypto-rust"] }
tiny_http = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_sort_by = "allow"
large_enum_variant = "allow"
collapsible_if = "allow"
explicit_counter_loop = "allow"
redundant_guards = "allow"
field_reassign_with_default = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
