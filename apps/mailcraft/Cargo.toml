[package]
name = "mailcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "MailCraft: mail and calendar for Microsoft 365 (Exchange Online, through Microsoft Graph)"

[lints]
workspace = true

[dependencies]
mailcraft-ui = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
pollster = "0.4"
open = { workspace = true }
# MailCraft's own sign-in window (WebView2 on Windows, WebKitGTK on Linux), run as a separate
# process so the web view and its event loop never share the main window's.
wry = "0.57"
tao = "0.37"

[build-dependencies]
winresource = "0.1"
